openapi: 3.0.0
paths:
  /api/v1/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '201':
          description: ''
      security: []
      summary: Sign in and issue an access and refresh token pair
      tags: &ref_0
        - auth
  /api/v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      responses:
        '201':
          description: ''
      security: []
      summary: Exchange a refresh token for a new token pair
      tags: *ref_0
  /api/v1/auth/forgot-password:
    post:
      description: >-
        Always succeeds, whether or not the address belongs to an account, so the response cannot be used to discover
        who has one.
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordDto'
      responses:
        '201':
          description: ''
      security: []
      summary: Request a password reset link by email
      tags: *ref_0
  /api/v1/auth/reset-password:
    post:
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '201':
          description: ''
      security: []
      summary: Set a new password using a reset link token
      tags: *ref_0
  /api/v1/auth/change-password:
    post:
      operationId: AuthController_changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: Change the signed-in user's own password
      tags: *ref_0
  /api/v1/auth/logout:
    post:
      description: Signs out this device only; the account's sessions on other devices stay valid.
      operationId: AuthController_logout
      parameters: []
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: Revoke the caller's session
      tags: *ref_0
  /api/v1/auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Read the signed-in user's own profile
      tags: *ref_0
    patch:
      operationId: AuthController_updateProfile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Update the signed-in user's own directory fields
      tags: *ref_0
  /api/v1/auth/me/avatar:
    post:
      operationId: AuthController_updateAvatar
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: Replace the signed-in user's own avatar
      tags: *ref_0
    delete:
      operationId: AuthController_removeAvatar
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Remove the signed-in user's own avatar
      tags: *ref_0
  /api/v1/auth/me/signature:
    post:
      description: Applies at once for an administrator; anyone else submits it for administrator review.
      operationId: AuthController_updateSignature
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: Replace the signed-in user's own electronic signature
      tags: *ref_0
    delete:
      operationId: AuthController_removeSignature
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Remove the signed-in user's own electronic signature
      tags: *ref_0
  /api/v1/auth/me/signature/request:
    delete:
      operationId: AuthController_withdrawSignatureRequest
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Withdraw the signed-in user's signature waiting for review
      tags: *ref_0
  /api/v1/notifications:
    get:
      description: >-
        One keyset page, newest first, each row carrying the read flag of the calling user only. Send the returned
        `nextCursor` back as `cursor` for the next page; a null `nextCursor` means there is nothing older left.
      operationId: NotificationController_findAll
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            type: number
        - name: cursor
          required: false
          in: query
          description: Id of the last row of the previous page
          schema:
            type: number
      responses:
        '200':
          description: One page for this user
      security: &ref_1
        - bearer: []
      summary: List notifications addressed to the current user
      tags: &ref_2
        - notifications
  /api/v1/notifications/unread-count:
    get:
      operationId: NotificationController_unreadCount
      parameters: []
      responses:
        '200':
          description: ''
      security: *ref_1
      summary: Count notifications this user has neither read nor seen closed
      tags: *ref_2
  /api/v1/notifications/read-all:
    patch:
      operationId: NotificationController_markAllRead
      parameters: []
      responses:
        '200':
          description: ''
      security: *ref_1
      summary: Mark every notification of this user read
      tags: *ref_2
  /api/v1/notifications/{id}/read:
    patch:
      operationId: NotificationController_markRead
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '403':
          description: Notification is not addressed to this user
      security: *ref_1
      summary: Mark one notification read for this user
      tags: *ref_2
  /api/v1/users:
    get:
      description: Paginated account list with keyword search, role filter and active filter.
      operationId: UsersController_findAll
      parameters:
        - name: page
          required: false
          in: query
          description: Page number
          schema:
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Items per page
          schema:
            default: 25
            type: number
        - name: search
          required: false
          in: query
          description: Search keyword
          schema:
            type: string
        - name: searchClassifications
          required: false
          in: query
          description: Enum values whose translated label matched the keyword
          schema:
            type: array
            items:
              type: string
        - name: columnFilters
          required: false
          in: query
          description: JSON map of column key to selected values, e.g. {"classification":["mechanical"]}
          schema:
            type: string
        - name: sortBy
          required: false
          in: query
          description: Sort column. Omitted means newest first (createdAt descending); an explicit column defaults to ascending.
          schema:
            default: createdAt
            type: string
        - name: sortOrder
          required: false
          in: query
          description: Sort order. Defaults to DESC for createdAt, ASC otherwise.
          schema:
            default: DESC
            type: string
        - name: roleCode
          required: false
          in: query
          description: Filter by role code
          schema:
            type: string
        - name: isActive
          required: false
          in: query
          description: Filter by account state; omitted returns both
          schema:
            type: boolean
      responses:
        '200':
          description: ''
      security: &ref_3
        - bearer: []
      summary: List users
      tags: &ref_4
        - users
    post:
      description: Without a password the account is mailed a single-use link to set its own.
      operationId: UsersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: ''
      security: *ref_3
      summary: Create an account
      tags: *ref_4
  /api/v1/users/column-values:
    get:
      description: >-
        Paginated, searchable distinct values of a filterable list column, for the column filter of the list table.
        Values come from the whole table, not one page.
      operationId: UsersController_findColumnValues
      parameters:
        - name: column
          required: true
          in: query
          description: >-
            Column key: username, fullName, email, phone, department, title, isActive, lastLoginAt, avatarUrl,
            signatureUrl, roleName
          schema:
            example: classification
            type: string
        - name: search
          required: false
          in: query
          description: Search within the values
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Page number
          schema:
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Values per page
          schema:
            default: 50
            type: number
        - name: columnFilters
          required: false
          in: query
          description: JSON map of column key to selected values, e.g. {"classification":["mechanical"]}
          schema:
            type: string
        - name: listSearch
          required: false
          in: query
          description: Keyword search of the list itself
          schema:
            type: string
        - name: searchClassifications
          required: false
          in: query
          description: Enum values whose translated label matched the keyword
          schema:
            type: array
            items:
              type: string
        - name: roleCode
          required: false
          in: query
          description: Filter by role code
          schema:
            type: string
        - name: isActive
          required: false
          in: query
          description: Filter by account state; omitted returns both
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated distinct column values
        '400':
          description: Column is not filterable
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — requires *:*
      security: *ref_3
      summary: List distinct values of one filterable user column
      tags: *ref_4
  /api/v1/users/roles:
    get:
      operationId: UsersController_findAssignableRoles
      parameters: []
      responses:
        '200':
          description: ''
      security: *ref_3
      summary: List the roles an account can be assigned to
      tags: *ref_4
  /api/v1/users/{id}:
    get:
      operationId: UsersController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security: *ref_3
      summary: Read one account
      tags: *ref_4
    patch:
      operationId: UsersController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: ''
      security: *ref_3
      summary: Update an account
      tags: *ref_4
    delete:
      description: 'Soft-deletes the account: it leaves the list, frees its username and email, and loses every session it holds.'
      operationId: UsersController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security: *ref_3
      summary: Delete an account
      tags: *ref_4
  /api/v1/users/{id}/active:
    patch:
      description: A deactivated account keeps its records but loses every session it holds.
      operationId: UsersController_setActive
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserActiveDto'
      responses:
        '200':
          description: ''
      security: *ref_3
      summary: Deactivate or restore an account
      tags: *ref_4
  /api/v1/users/{id}/signature/approve:
    post:
      description: The waiting signature becomes the one printed documents stamp, replacing the old one.
      operationId: UsersController_approveSignature
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '201':
          description: ''
      security: *ref_3
      summary: Approve an account's signature waiting for review
      tags: *ref_4
  /api/v1/users/signatures/bulk-approve:
    post:
      description: >-
        Approves the given ids through the same rules as the single-row approval, one at a time. A row that approval
        refuses is reported in `failed` and leaves the rest of the batch approved.
      operationId: UsersController_bulkApproveSignatures
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkApproveDto'
      responses:
        '201':
          description: 'Per-id outcome: `{ approved: number[], failed: [{ id, message }] }`'
        '400':
          description: Empty or invalid id list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — requires *:*
      security: *ref_3
      summary: Approve selected user signatures
      tags: *ref_4
  /api/v1/users/{id}/signature/reject:
    post:
      description: The waiting signature is dropped; the reason is shown to the holder on their profile.
      operationId: UsersController_rejectSignature
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectSignatureDto'
      responses:
        '201':
          description: ''
      security: *ref_3
      summary: Reject an account's signature waiting for review
      tags: *ref_4
  /api/v1/users/bulk-deactivate:
    post:
      description: 'Reports per row: a refused account leaves the rest of the batch deactivated.'
      operationId: UsersController_bulkDeactivate
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteDto'
      responses:
        '201':
          description: ''
      security: *ref_3
      summary: Deactivate every ticked account
      tags: *ref_4
  /api/v1/users/bulk-delete:
    post:
      description: >-
        Soft-deletes the given ids through the same guards as the single-row delete, one at a time. A row a guard
        refuses is reported in `failed` and leaves the rest of the batch deleted.
      operationId: UsersController_bulkRemove
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteDto'
      responses:
        '201':
          description: 'Per-id outcome: `{ deleted: number[], failed: [{ id, message }] }`'
        '400':
          description: Empty or invalid id list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — requires *:*
      security: *ref_3
      summary: Soft-delete selected user accounts
      tags: *ref_4
  /api/v1/users/import:
    post:
      description: >-
        All or nothing: each row is judged by the create form's own rules and saved through the same create, in one
        transaction. Any error rejects the file with every problem located by sheet row. No password is read from the
        file.
      operationId: UsersController_importUsers
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExcelImportRequestDto'
      responses:
        '201':
          description: '{ created, updated }'
        '400':
          description: Import rejected — errors[{ fileRow, field?, code, message? }]
        '403':
          description: Forbidden
      security: *ref_3
      summary: Import accounts from a parsed .xlsx
      tags: *ref_4
  /api/v1/users/export:
    post:
      description: >-
        Queues every account matching the posted search/filters/sort as a zipped .xlsx laid out like the list, one row
        per account. Follow the job on GET /excel/jobs/{id}/events and download it once from GET
        /excel/jobs/{id}/download.
      operationId: UsersController_export
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserExportDto'
      responses:
        '202':
          description: Queued; returns jobId
        '400':
          description: invalidSpec or unknownField — a column the list cannot export
        '403':
          description: Forbidden
        '429':
          description: tooManyJobs
      security: *ref_3
      summary: Queue an Excel export of the account list
      tags: *ref_4
  /api/v1/users/{id}/reset-password:
    post:
      operationId: UsersController_resetPassword
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordDto'
      responses:
        '201':
          description: ''
      security: *ref_3
      summary: Set another account's password
      tags: *ref_4
  /api/v1/list-preferences/{moduleKey}:
    get:
      operationId: ListPreferenceController_find
      parameters:
        - name: moduleKey
          required: true
          in: path
          schema:
            example: rfq_list_v3
            type: string
      responses:
        '200':
          description: Stored choice, or null when unset
        '400':
          description: Unknown module key
        '401':
          description: Unauthorized
      security: &ref_5
        - bearer: []
      summary: Read the caller's column choice for one list
      tags: &ref_6
        - users/list-preferences
    put:
      operationId: ListPreferenceController_upsert
      parameters:
        - name: moduleKey
          required: true
          in: path
          schema:
            example: rfq_list_v3
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListPreferenceDto'
      responses:
        '200':
          description: Stored choice
        '400':
          description: Unknown module key or bad columns
        '401':
          description: Unauthorized
      security: *ref_5
      summary: Store the caller's column choice for one list
      tags: *ref_6
  /api/v1/files/upload:
    post:
      operationId: FilesController_upload
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: ''
      security: &ref_7
        - bearer: []
      summary: Upload one file and store it
      tags: &ref_8
        - files
  /api/v1/files/{id}:
    get:
      operationId: FilesController_getUrl
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: disposition
          required: false
          in: query
          description: How the browser should treat the object. `inline` views it, `attachment` saves it.
          schema:
            type: string
            enum:
              - inline
              - attachment
        - name: fileName
          required: false
          in: query
          description: Name the saved file should carry. Only used with `disposition=attachment`.
          schema:
            type: string
      responses:
        '200':
          description: ''
      security: *ref_7
      summary: Issue a short-lived signed URL for one stored file
      tags: *ref_8
  /api/v1/excel/template:
    post:
      operationId: ExcelController_template
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExcelTemplateBodyDto'
      responses:
        '200':
          description: Header-only workbook
        '400':
          description: invalidSpec
      security: &ref_9
        - bearer: []
      summary: Build an empty import template from a sheet spec
      tags: &ref_10
        - excel
  /api/v1/excel/parse:
    post:
      operationId: ExcelController_parse
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                sheet:
                  type: string
                label:
                  type: string
      responses:
        '202':
          description: Queued; returns jobId
        '400':
          description: invalidSpec, invalidFile or fileTooLarge
        '429':
          description: tooManyJobs
      security: *ref_9
      summary: Queue an uploaded .xlsx to be read against a sheet spec
      tags: *ref_10
  /api/v1/excel/jobs/{id}:
    get:
      operationId: ExcelController_snapshot
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Job snapshot
        '404':
          description: jobNotFound
      security: *ref_9
      summary: Current state of one of your Excel jobs
      tags: *ref_10
  /api/v1/excel/jobs/{id}/events:
    get:
      description: Sends one snapshot, then progress events, then one completed or failed event, then closes.
      operationId: ExcelController_events
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Event stream
        '404':
          description: jobNotFound
      security: *ref_9
      summary: Server-sent events for one of your Excel jobs
      tags: *ref_10
  /api/v1/excel/jobs/{id}/result:
    get:
      operationId: ExcelController_result
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Keyed rows
        '404':
          description: jobNotFound
        '409':
          description: jobNotCompleted
      security: *ref_9
      summary: Rows read by one of your finished parse jobs
      tags: *ref_10
  /api/v1/excel/jobs/{id}/download:
    get:
      description: The stored file is deleted as soon as this download completes, or 30 minutes after it was ready.
      operationId: ExcelController_download
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Zip stream
        '404':
          description: jobNotFound
        '409':
          description: jobNotCompleted
        '410':
          description: fileExpired
      security: *ref_9
      summary: Download the zip of one of your finished exports, once
      tags: *ref_10
  /api/v1/roles:
    get:
      operationId: RolesController_findAll
      parameters: []
      responses:
        '200':
          description: ''
      security: &ref_11
        - bearer: []
      summary: List roles with the permissions they grant
      tags: &ref_12
        - roles
  /api/v1/roles/permissions:
    get:
      operationId: RolesController_findPermissionCatalog
      parameters: []
      responses:
        '200':
          description: ''
      security: *ref_11
      summary: List every permission the build defines, grouped by resource
      tags: *ref_12
  /api/v1/roles/{id}/permissions:
    patch:
      operationId: RolesController_updatePermissions
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolePermissionsDto'
      responses:
        '200':
          description: ''
      security: *ref_11
      summary: Replace a role's permission set
      tags: *ref_12
  /api/v1/health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: ''
      security: []
      summary: Report service liveness
      tags:
        - health
  /api/v1/customers:
    get:
      description: Paginated customer list with search and column filters. A Sales actor sees only the customers they own.
      operationId: CustomerController_findAll
      parameters:
        - name: page
          required: false
          in: query
          description: Page number
          schema:
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Items per page
          schema:
            default: 25
            type: number
        - name: search
          required: false
          in: query
          description: Search keyword
          schema:
            type: string
        - name: searchClassifications
          required: false
          in: query
          description: Enum values whose translated label matched the keyword
          schema:
            type: array
            items:
              type: string
        - name: columnFilters
          required: false
          in: query
