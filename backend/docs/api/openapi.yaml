  /api/v1/sales/quotations:
    get:
      description: >-
        Paginated list with the request and the latest version of each; filter by the latest version status, code,
        customer or request. The keyword matches the quotation code or the code or title of its request. A Sales actor
        sees the quotations of the requests they own.
      operationId: QuotationController_findAll
      parameters:
        - name: page
          required: false
          in: query
          description: Page number
          schema:
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Items per page
          schema:
            default: 25
            type: number
        - name: search
          required: false
          in: query
          description: Search keyword
          schema:
            type: string
        - name: searchClassifications
          required: false
          in: query
          description: Enum values whose translated label matched the keyword
          schema:
            type: array
            items:
              type: string
        - name: columnFilters
          required: false
          in: query
          description: JSON map of column key to selected values, e.g. {"classification":["mechanical"]}
          schema:
            type: string
        - name: status
          required: false
          in: query
          description: Status of the latest version
          schema:
            type: string
            enum:
              - draft
              - pending_approval
              - approved
              - rejected
              - customer_confirmed
              - cancelled
              - closed
        - name: code
          required: false
          in: query
          description: Part of the quotation code
          schema:
            type: string
        - name: customerId
          required: false
          in: query
          description: Only quotations of this customer
          schema:
            type: number
        - name: requestId
          required: false
          in: query
          description: Only the quotation of this request
          schema:
            type: number
      responses:
        '200':
          description: Paginated quotation list
        '403':
          description: Forbidden — requires quotation:read
      security: &ref_29
        - bearer: []
      summary: List quotations
      tags: &ref_30
        - sales/quotations
    post:
      description: >-
        Builds version 1 (draft, code NN-ddmmyyyy/BG) from the latest submitted estimate revision and leaves the request
        estimated. A revision that is not the latest submitted one, a request not estimated, or a request that already
        has a quotation answer 409.
      operationId: QuotationController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuotationDto'
      responses:
        '201':
          description: Quotation created as a draft
        '403':
          description: Forbidden — requires quotation:create
        '404':
          description: Not found, or outside the caller’s data scope (a Sales actor reads the quotations of requests they own)
        '409':
          description: No submitted estimate, not the latest revision, request not estimated, or a quotation exists
      security: *ref_29
      summary: Quote an estimated request
      tags: *ref_30
  /api/v1/sales/quotations/{id}:
    get:
      description: >-
        The header, the request it answers, the version list, and the lines with their frozen BOM and cost-line copies
        of the version asked for (the latest by default).
      operationId: QuotationController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
        - name: ver
          required: false
          in: query
          description: Version number to read; the latest when omitted
          schema:
            type: number
      responses:
        '200':
          description: Quotation found
        '404':
          description: Not found, or outside the caller’s data scope (a Sales actor reads the quotations of requests they own)
      security: *ref_29
      summary: Get a quotation with one version
      tags: *ref_30
    patch:
      description: >-
        Only what the body names changes; margins are per line (0–1000%), the discount a percent (0–100) or an amount
        not above the subtotal, VAT one of 0/5/8/10, and the terms replace the printed list. The server recomputes and
        stores every total.
      operationId: QuotationController_updatePricing
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuotationPricingDto'
      responses:
        '200':
          description: Pricing updated
        '400':
          description: Invalid figure, or a discount above the subtotal
        '403':
          description: Forbidden — requires quotation:update
        '404':
          description: Not found, or outside the caller’s data scope (a Sales actor reads the quotations of requests they own)
        '409':
          description: The latest version is not a draft
      security: *ref_29
      summary: Set margins, discount, VAT and terms of the draft version
      tags: *ref_30
