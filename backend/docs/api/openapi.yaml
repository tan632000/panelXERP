      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplierReturnDto'
      responses:
        '200':
          description: 'The request key was posted before: the first return'
        '201':
          description: Return posted
        '400':
          description: Validation error, no reason, or a line not on the order
        '404':
          description: Purchase order not found
        '409':
          description: Nothing received on the order, more than received or on hand, or item deleted
      security: *ref_47
      summary: Return received goods to the supplier
      tags: *ref_48
  /api/v1/inventory/supplier-returns/{id}:
    get:
      description: Unit costs, values and reference values only with purchase_price:read.
      operationId: SupplierReturnController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: Supplier return
        '404':
          description: Not found
      security: *ref_47
      summary: Get a supplier return with its lines
      tags: *ref_48
  /api/v1/inventory/stocktakes:
    get:
      operationId: StocktakeController_findAll
      parameters:
        - name: page
          required: false
          in: query
          description: Page number
          schema:
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Items per page
          schema:
            default: 25
            type: number
        - name: search
          required: false
          in: query
          description: Search keyword
          schema:
            type: string
        - name: searchClassifications
          required: false
          in: query
          description: Enum values whose translated label matched the keyword
          schema:
            type: array
            items:
              type: string
        - name: columnFilters
          required: false
          in: query
          description: JSON map of column key to selected values, e.g. {"classification":["mechanical"]}
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - counting
              - submitted
              - approved
              - cancelled
      responses:
        '200':
          description: Paginated stock counts
      security: &ref_49
        - bearer: []
      summary: List stock counts
      tags: &ref_50
        - inventory/stocktakes
    post:
      operationId: StocktakeController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStocktakeDto'
      responses:
        '201':
          description: Count opened
        '409':
          description: Another count is still open
      security: *ref_49
      summary: Open a count of the whole warehouse or one location
      tags: *ref_50
  /api/v1/inventory/stocktakes/{id}:
    get:
      description: >-
        Book and counted quantities and the difference to every reader; unit costs and values only with
        purchase_price:read.
      operationId: StocktakeController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: Stock count
        '404':
          description: Not found
      security: *ref_49
      summary: Get a stock count with its lines
      tags: *ref_50
  /api/v1/inventory/stocktakes/{id}/scan:
    post:
      description: An item without a line gets one. Records the book quantity of the moment.
      operationId: StocktakeController_scan
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeScanDto'
      responses:
        '200':
          description: Counted
        '404':
          description: Count or item not found
        '409':
          description: The count is not being counted
      security: *ref_49
      summary: Count one more of a scanned item
      tags: *ref_50
  /api/v1/inventory/stocktakes/{id}/lines/{itemId}:
    patch:
      operationId: StocktakeController_setCount
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
        - name: itemId
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeCountDto'
      responses:
        '200':
          description: Counted
        '404':
          description: Count or line not found
        '409':
          description: The count is not being counted
      security: *ref_49
      summary: Set the counted quantity of an item on the count
      tags: *ref_50
  /api/v1/inventory/stocktakes/{id}/submit:
    post:
      operationId: StocktakeController_submit
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: Submitted
        '409':
          description: Not being counted
      security: *ref_49
      summary: Submit a count for approval
      tags: *ref_50
  /api/v1/inventory/stocktakes/{id}/approve:
    post:
      description: Refused to its creator, every submitter and every counter. A result below zero refuses the whole count.
      operationId: StocktakeController_approve
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: Approved and posted
        '403':
          description: The actor took part in the count
        '409':
          description: Not submitted, or an item would go below zero
      security: *ref_49
      summary: Approve a submitted count and post its differences
      tags: *ref_50
  /api/v1/inventory/stocktakes/{id}/reject:
    post:
      operationId: StocktakeController_reject
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeReasonDto'
      responses:
        '200':
          description: Back to counting
        '403':
          description: The actor took part in the count
        '409':
          description: Not submitted
      security: *ref_49
      summary: Send a submitted count back to counting
      tags: *ref_50
  /api/v1/inventory/stocktakes/{id}/cancel:
    post:
      operationId: StocktakeController_cancel
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeReasonDto'
      responses:
        '200':
          description: Cancelled
        '409':
          description: Not open
      security: *ref_49
      summary: Cancel an open count
      tags: *ref_50
info:
  title: panelXERP
  description: REST API — ERP Hải Phòng Manufacturing Platform
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: /
    description: Current host
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        username:
          type: string
          description: Username or email
        password:
          type: string
          description: Password (min 6 characters)
          minLength: 6
      required:
        - username
        - password
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          description: Email address the reset link is sent to
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: Token from the reset link
        newPassword:
          type: string
          description: Password must be at least 8 characters and contain a letter, a digit and a special character
          minLength: 8
      required:
        - token
        - newPassword
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          description: The password currently in use
        newPassword:
          type: string
          description: Password must be at least 8 characters and contain a letter, a digit and a special character
          minLength: 8
      required:
        - currentPassword
        - newPassword
    UpdateProfileDto:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 255
        currentPassword:
          type: string
          description: The password currently in use; required to change the email
        fullName:
          type: string
          maxLength: 100
        phone:
          type: object
          maxLength: 20
          nullable: true
        department:
          type: string
          enum: &ref_51
            - sales
            - planning
            - purchasing
            - technical
            - qcLab
            - warehouse
            - accounting
            - other
          nullable: true
        title:
          type: object
          maxLength: 100
          nullable: true
      required:
        - fullName
    CreateUserDto:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 255
        fullName:
          type: string
          maxLength: 100
        roleCode:
          type: string
          description: Role code the account is assigned to
        password:
          type: string
          description: Password must be at least 8 characters and contain a letter, a digit and a special character
          minLength: 8
        phone:
          type: object
          maxLength: 20
          nullable: true
        department:
          type: string
          enum: *ref_51
          nullable: true
        title:
          type: object
          maxLength: 100
          nullable: true
        isActive:
          type: boolean
          default: true
      required:
        - username
        - email
        - fullName
        - roleCode
    UpdateUserDto:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 255
        fullName:
          type: string
          maxLength: 100
        roleCode:
          type: string
          description: Role code the account is assigned to
        phone:
          type: object
          maxLength: 20
          nullable: true
        department:
          type: string
          enum: *ref_51
          nullable: true
        title:
          type: object
          maxLength: 100
          nullable: true
        isActive:
          type: boolean
          default: true
    SetUserActiveDto:
      type: object
      properties:
        isActive:
          type: boolean
          description: False deactivates the account and revokes its sessions
      required:
        - isActive
    BulkApproveDto:
      type: object
      properties:
        ids:
          description: Ids of the rows to approve (1–2000)
          type: array
          items:
            type: number
      required:
        - ids
    RejectSignatureDto:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: Shown to the account holder on their profile
      required:
        - reason
    BulkDeleteDto:
      type: object
      properties:
        ids:
          description: Ids of the rows to delete (1–2000)
          type: array
          items:
            type: number
      required:
        - ids
    ExcelImportRequestDto:
      type: object
      properties:
        documents:
          type: array
          description: >-
            Documents to create or update (1–500). Each is the feature's create payload plus `fileRow`, an optional
            `code` (an existing active code updates that record), and a `fileRow` on every line.
          items:
            type: object
      required:
        - documents
    UserFilterDto:
      type: object
      properties:
        page:
          type: number
          default: 1
          description: Page number
        limit:
          type: number
          default: 25
          description: Items per page
        search:
          type: string
          description: Search keyword
        searchClassifications:
          description: Enum values whose translated label matched the keyword
          type: array
          items:
            type: string
        columnFilters:
          type: string
          description: JSON map of column key to selected values, e.g. {"classification":["mechanical"]}
        sortBy:
          type: string
          description: Sort column. Omitted means newest first (createdAt descending); an explicit column defaults to ascending.
          default: createdAt
        sortOrder:
          type: string
          description: Sort order. Defaults to DESC for createdAt, ASC otherwise.
          default: DESC
        roleCode:
          type: string
          description: Filter by role code
        isActive:
          type: boolean
          description: Filter by account state; omitted returns both
    ExcelFieldRefDto:
      type: object
      properties:
        field:
          type: string
          description: Row field name
          example: orderDate
        type:
          type: string
          enum:
            - text
            - number
            - date
          default: text
        valueLabels:
          type: object
          description: Display label per stored value, e.g. an enum member
          additionalProperties:
            type: string
      required:
        - field
    ExcelColumnSpecDto:
      type: object
      properties:
        key:
          type: string
          description: Column key
          example: orderCode
        label:
          type: string
          description: Display label drawn in the header
        headerGroup:
          description: Header group labels, outermost first
          type: array
          items:
            type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ExcelFieldRefDto'
        combine:
          type: string
          enum:
            - join
            - coalesce
          default: join
        joinWith:
          type: string
          description: Separator for `join`
          default: ' '
        numberFormat:
          type: string
          description: 'Excel number format, e.g. #,##0.00'
        groupSpan:
          type: boolean
          description: Write once per row group and merge across the group
        width:
          type: number
          description: Column width in Excel characters
        required:
          type: boolean
          description: Whether this column must hold a value on every import row
      required:
        - key
        - label
    ExcelSheetSpecDto:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ExcelColumnSpecDto'
        rowGroupField:
          type: string
          description: Row field whose consecutive equal values form one record
        sheetName:
          type: string
          description: Worksheet name
      required:
        - columns
    UserExportDto:
      type: object
      properties:
        query:
          description: The list search, filters, column filters and sort in force; page and limit are ignored
          allOf:
            - $ref: '#/components/schemas/UserFilterDto'
        sheet:
          $ref: '#/components/schemas/ExcelSheetSpecDto'
        fileName:
          type: string
          description: File name without extension
          example: nguoi-dung_2026-10-14
      required:
        - query
        - sheet
        - fileName
    AdminResetPasswordDto:
      type: object
      properties:
        newPassword:
          type: string
          description: Password must be at least 8 characters and contain a letter, a digit and a special character
          minLength: 8
      required:
        - newPassword
    UpdateListPreferenceDto:
      type: object
      properties:
        visibleColumns:
          description: Column keys the user leaves visible
          example:
            - customerCode
            - status
          type: array
          items:
            type: string
        frozenColumn:
          type: string
          nullable: true
          description: Last column pinned while scrolling sideways; null unfreezes, absent keeps the stored choice
          example: customerCode
        columnWidths:
          type: object
          additionalProperties:
            type: number
          description: Width in pixels of each column the user dragged, keyed by column key; absent keeps the stored widths
          example:
            customerCode: 120
            status: 96
      required:
        - visibleColumns
    ExcelTemplateBodyDto:
      type: object
      properties:
        sheet:
          $ref: '#/components/schemas/ExcelSheetSpecDto'
      required:
        - sheet
    UpdateRolePermissionsDto:
      type: object
      properties:
        permissions:
          description: The full permission set the role should hold after the save
          type: array
          items:
            type: string
      required:
        - permissions
    CreateCustomerDto:
      type: object
      properties:
        code:
          type: string
          description: Customer code (KH_xxxx)
          maxLength: 30
          example: KH_0001
        name:
          type: string
          description: Customer name
          maxLength: 255
        taxCode:
          type: string
          description: Tax code
          maxLength: 20
        address:
          type: string
          description: Address
          maxLength: 500
        phone:
          type: string
          description: Phone number
          maxLength: 20
        email:
          type: string
          description: Email address
          maxLength: 255
        salesOwnerId:
          type: number
          description: Owning sales account. Defaults to the caller; only an actor who sees all customers may name another account.
        note:
          type: string
          description: Note
          maxLength: 2000
      required:
        - code
        - name
    UpdateCustomerDto:
      type: object
      properties:
        code:
          type: string
          description: Customer code (KH_xxxx)
          maxLength: 30
          example: KH_0001
        name:
          type: string
          description: Customer name
          maxLength: 255
        taxCode:
          type: string
          description: Tax code
          maxLength: 20
        address:
          type: string
          description: Address
          maxLength: 500
        phone:
          type: string
          description: Phone number
          maxLength: 20
        email:
          type: string
          description: Email address
          maxLength: 255
        salesOwnerId:
          type: number
          description: Owning sales account. Defaults to the caller; only an actor who sees all customers may name another account.
        note:
          type: string
          description: Note
          maxLength: 2000
    CreateContactDto:
      type: object
      properties:
        customerId:
          type: number
          description: Customer the contact belongs to
        name:
          type: string
          description: Contact name
          maxLength: 255
        position:
          type: string
          description: Position
          maxLength: 100
        phone:
          type: string
          description: Phone number
          maxLength: 20
        email:
          type: string
          description: Email address
          maxLength: 255
        isPrimary:
          type: boolean
          description: Primary contact of the customer; setting it demotes the previous primary contact.
      required:
        - customerId
        - name
    UpdateContactDto:
      type: object
      properties:
        name:
          type: string
          description: Contact name
          maxLength: 255
        position:
          type: string
          description: Position
          maxLength: 100
        phone:
          type: string
          description: Phone number
          maxLength: 20
        email:
          type: string
          description: Email address
          maxLength: 255
        isPrimary:
          type: boolean
          description: Primary contact of the customer; setting it demotes the previous primary contact.
    CreateProjectDto:
      type: object
      properties:
        code:
          type: string
          description: Project code (DA_xxxx)
          maxLength: 30
          example: DA_0001
        customerId:
          type: number
          description: Customer the project belongs to
        name:
          type: string
          description: Project name
          maxLength: 255
        siteAddress:
          type: string
          description: Site address
          maxLength: 500
        note:
          type: string
          description: Note
          maxLength: 2000
      required:
        - code
        - customerId
        - name
    UpdateProjectDto:
      type: object
      properties:
        code:
          type: string
          description: Project code (DA_xxxx)
          maxLength: 30
          example: DA_0001
        name:
          type: string
          description: Project name
          maxLength: 255
        siteAddress:
          type: string
          description: Site address
          maxLength: 500
        note:
          type: string
          description: Note
          maxLength: 2000
    CreateItemDto:
      type: object
      properties:
        code:
          type: string
          description: Manufacturer part number or internal code
          maxLength: 64
          example: LC1D09M7
        name:
          type: string
          description: Item name
          maxLength: 255
        specification:
          type: string
          description: Technical specification
        brand:
          type: string
          description: Brand
          maxLength: 255
        group:
          type: string
          description: Item group
          enum: &ref_52
            - enclosure
            - breaker
            - contactor
            - relay
            - plc
            - inverter
            - cable
            - terminal
            - accessory
            - other
        unit:
          type: string
          description: Unit of measure, e.g. pcs, m, set
          maxLength: 20
        referencePrice:
          type: number
          description: Reference purchase price in VND (>= 0)
          nullable: true
        note:
          type: string
          description: Note
          maxLength: 2000
      required:
        - code
        - name
        - group
        - unit
    UpdateItemDto:
      type: object
      properties:
        code:
          type: string
          description: Manufacturer part number or internal code
          maxLength: 64
          example: LC1D09M7
        name:
          type: string
          description: Item name
          maxLength: 255
        specification:
          type: string
          description: Technical specification
        brand:
          type: string
          description: Brand
          maxLength: 255
        group:
          type: string
          description: Item group
          enum: *ref_52
        unit:
          type: string
          description: Unit of measure, e.g. pcs, m, set
          maxLength: 20
        referencePrice:
          type: number
          description: Reference purchase price in VND (>= 0)
          nullable: true
        note:
          type: string
          description: Note
          maxLength: 2000
    UpdateItemStockSettingsDto:
      type: object
      properties:
        barcode:
          type: object
          description: Barcode, unique among active items and never another item code (any case)
          maxLength: 64
          nullable: true
        defaultLocationId:
          type: number
          description: Default warehouse location id
          nullable: true
        minStock:
          type: number
          description: Minimum stock (>= 0); blank means no low-stock alert
          nullable: true
    CreateLocationDto:
      type: object
      properties:
        code:
          type: string
          description: Location code, unique among active locations (any case)
          maxLength: 32
          example: A-01-02
        name:
          type: string
          description: Location name
          maxLength: 255
        note:
          type: string
          description: Note
          maxLength: 2000
        isActive:
          type: boolean
          description: Whether the location is in use. Defaults to true.
      required:
        - code
        - name
    UpdateLocationDto:
      type: object
      properties:
        code:
          type: string
          description: Location code, unique among active locations (any case)
          maxLength: 32
          example: A-01-02
        name:
          type: string
          description: Location name
          maxLength: 255
        note:
          type: string
          description: Note
          maxLength: 2000
        isActive:
          type: boolean
          description: Whether the location is in use. Defaults to true.
    CreateRequestDto:
      type: object
      properties:
        customerId:
          type: number
          description: Customer the request is for
        projectId:
          type: object
          description: Project of that customer the request belongs to
          nullable: true
        contactId:
          type: object
          description: Contact person of that customer
          nullable: true
        title:
          type: string
          description: Request title
          maxLength: 255
        technicalRequirements:
          type: object
          description: Technical requirements
          maxLength: 10000
          nullable: true
        requestedDeliveryDate:
          type: object
          description: Date the customer wants delivery (YYYY-MM-DD)
          example: '2027-02-15'
          nullable: true
        quotationDueDate:
          type: object
          description: Date the quotation is due (YYYY-MM-DD)
          example: '2027-01-20'
          nullable: true
      required:
        - customerId
        - title
    UpdateRequestDto:
      type: object
      properties:
        projectId:
          type: object
          description: Project of that customer the request belongs to
          nullable: true
        contactId:
          type: object
          description: Contact person of that customer
          nullable: true
        title:
          type: string
          description: Request title
          maxLength: 255
        technicalRequirements:
          type: object
          description: Technical requirements
          maxLength: 10000
          nullable: true
        requestedDeliveryDate:
          type: object
          description: Date the customer wants delivery (YYYY-MM-DD)
          example: '2027-02-15'
          nullable: true
        quotationDueDate:
          type: object
          description: Date the quotation is due (YYYY-MM-DD)
          example: '2027-01-20'
          nullable: true
    AssignRequestDto:
      type: object
      properties:
        engineerId:
          type: number
          description: Engineer (or engineering lead) to assign
      required:
        - engineerId
    RequestReasonDto:
      type: object
      properties:
        reason:
          type: string
          description: Why the request is closed
          maxLength: 1000
      required:
        - reason
    CreateEstimateDto:
      type: object
      properties:
        requestId:
          type: number
          description: The assigned request to build the estimate for
      required:
        - requestId
    CreatePanelDto:
      type: object
      properties:
        tag:
          type: string
          description: Panel tag, unique within the revision
          example: MSB-01
          maxLength: 50
        description:
          type: object
          description: Description
          maxLength: 500
          nullable: true
        quantity:
          type: number
          description: How many identical panels are built
          minimum: 1
      required:
        - tag
        - quantity
    UpdatePanelDto:
      type: object
      properties:
        tag:
          type: string
          description: Panel tag, unique within the revision
          example: MSB-01
          maxLength: 50
