info:
  title: panelXERP
  description: REST API — ERP Hải Phòng Manufacturing Platform
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: /
    description: Current host
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        username:
          type: string
          description: Username or email
        password:
          type: string
          description: Password (min 6 characters)
          minLength: 6
      required:
        - username
        - password
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          description: Email address the reset link is sent to
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: Token from the reset link
        newPassword:
          type: string
          description: Password must be at least 8 characters and contain a letter, a digit and a special character
          minLength: 8
      required:
        - token
        - newPassword
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          description: The password currently in use
        newPassword:
          type: string
          description: Password must be at least 8 characters and contain a letter, a digit and a special character
          minLength: 8
      required:
        - currentPassword
        - newPassword
    UpdateProfileDto:
      type: object
