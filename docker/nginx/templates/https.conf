map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __APP_HOST__;

    include /etc/nginx/snippets/acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __APP_HOST__;

    ssl_certificate /etc/letsencrypt/live/__APP_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__APP_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Mold/RFQ app cap is 100MB; 200m covers multipart overhead on the same request.
    client_max_body_size 200m;

    include /etc/nginx/snippets/gzip.conf;

    location /api/ {
        # CVE-2026-111497: the API never accepts Brotli-encoded request bodies.
        if ($http_content_encoding ~* "br") {
            return 415;
        }
        auth_basic off;
        proxy_pass http://backend:8080;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_buffering off;
    }

    location / {
        include /etc/nginx/snippets/basic-auth.conf;
        proxy_pass http://frontend:3000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
