# Compress JSON API responses and text assets; a response already encoded upstream
# (Next.js) passes through untouched. text/event-stream stays out so streams are not buffered.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    application/xml
    application/manifest+json
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
